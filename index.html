<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Spreadsheet</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar-row toolbar-row-title">
        <div class="sheet-title-wrap" id="sheet-title-wrap">
          <div
            id="sheet-title-field"
            class="sheet-title-field"
            contenteditable="false"
            role="textbox"
            aria-label="시트 제목"
            aria-multiline="false"
            data-placeholder="제목없음"
            spellcheck="false"
          ></div>
        </div>
      </div>
      <div class="toolbar-row toolbar-row-secondary">
        <span id="cell-coordinate" class="cell-coordinate">—</span>
        <div class="toolbar-secondary-end">
          <div class="toolbar-actions">
            <div class="toolbar-history" role="group" aria-label="실행 취소, 다시 실행 및 초기화">
              <button
                id="undo-btn"
                type="button"
                class="history-btn"
                disabled
                aria-label="실행 취소"
              >
                <svg
                  class="history-btn-icon history-btn-icon--undo"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="m15 14 5-5-5-5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M20 9H10a5 5 0 0 0 0 10"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="history-btn-shortcut" id="undo-shortcut-label"></span>
              </button>
              <button
                id="redo-btn"
                type="button"
                class="history-btn"
                disabled
                aria-label="다시 실행"
              >
                <svg
                  class="history-btn-icon"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="m15 14 5-5-5-5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M20 9H10a5 5 0 0 0 0 10"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <span class="history-btn-shortcut" id="redo-shortcut-label"></span>
              </button>
              <button
                id="reset-btn"
                type="button"
                class="history-btn history-btn--reset"
                aria-label="시트 초기화"
                title="시트 초기화"
              >
                <svg
                  class="history-btn-icon history-btn-icon--reset"
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M21 3v5h-5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <g transform="rotate(180 12 12)">
                    <path
                      d="M21 3v5h-5"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </g>
                </svg>
              </button>
            </div>
            <button
              id="help-guide-btn"
              type="button"
              class="help-guide-btn"
              aria-label="사용 가이드"
            >
              <svg
                class="help-guide-btn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75" />
                <circle cx="12" cy="8" r="1.15" fill="currentColor" />
                <path
                  d="M12 11v5.5"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
              </svg>
              <span class="help-guide-btn-label help-guide-btn-label--full">사용 가이드</span>
              <span class="help-guide-btn-label help-guide-btn-label--short" aria-hidden="true">가이드</span>
            </button>
            <button id="export-btn" type="button" class="export-btn">
              <span class="export-btn-text export-btn-text--full">Export Excel</span>
              <span class="export-btn-text export-btn-text--short" aria-hidden="true">Export</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="sheet-panel">
      <section class="grid-wrapper">
        <div id="spreadsheet" class="spreadsheet" aria-label="스프레드시트 그리드"></div>
      </section>
      <div class="grid-size-footer">
        <span id="grid-size-label" class="grid-size-label" aria-live="polite">5행 × 5열</span>
      </div>
    </div>
  </main>

  <menu id="context-menu" class="context-menu hidden" type="context"></menu>

  <div
    id="help-guide-modal"
    class="help-guide-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="help-guide-title"
    aria-hidden="true"
  >
    <div class="help-guide-backdrop" tabindex="-1"></div>
    <div class="help-guide-panel">
      <header class="help-guide-header">
        <h2 id="help-guide-title" class="help-guide-title">사용 가이드</h2>
        <button
          id="help-guide-close"
          type="button"
          class="help-guide-close"
          aria-label="닫기"
        >
          ×
        </button>
      </header>
      <div class="help-guide-body">
        <ul id="help-guide-list" class="help-guide-list"></ul>
      </div>
    </div>
  </div>

  <div
    id="reset-confirm-modal"
    class="reset-confirm-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reset-confirm-title"
    aria-hidden="true"
  >
    <div class="reset-confirm-backdrop" tabindex="-1"></div>
    <div class="reset-confirm-panel">
      <h2 id="reset-confirm-title" class="reset-confirm-title">시트 초기화</h2>
      <p class="reset-confirm-message">
        시트 제목·셀 내용·행·열 크기가 모두 지워지고 기본 5×5 빈 시트로 돌아갑니다.
        실행 취소 기록과 브라우저에 저장된 내용도 함께 삭제됩니다. 계속하시겠습니까?
      </p>
      <div class="reset-confirm-actions">
        <button
          id="reset-confirm-cancel"
          type="button"
          class="reset-confirm-btn reset-confirm-btn--secondary"
        >
          취소
        </button>
        <button
          id="reset-confirm-ok"
          type="button"
          class="reset-confirm-btn reset-confirm-btn--danger"
        >
          초기화
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
