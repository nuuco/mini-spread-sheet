<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Spreadsheet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <span id="cell-coordinate" class="cell-coordinate">Cell: A1</span>
      <button id="export-btn" type="button" class="export-btn">Export Excel</button>
    </header>

    <section class="grid-wrapper">
      <div id="spreadsheet" class="spreadsheet" aria-label="스프레드시트 그리드"></div>
    </section>

    <footer class="controls">
      <button id="add-row-btn" type="button">+ 행 추가</button>
      <button id="remove-row-btn" type="button">- 행 삭제</button>
      <button id="add-col-btn" type="button">+ 열 추가</button>
      <button id="remove-col-btn" type="button">- 열 삭제</button>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
