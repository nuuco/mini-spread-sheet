<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Spreadsheet</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar-row toolbar-row-title">
        <div class="sheet-title-wrap" id="sheet-title-wrap">
          <div
            id="sheet-title-field"
            class="sheet-title-field"
            contenteditable="false"
            role="textbox"
            aria-label="시트 제목"
            aria-multiline="false"
            data-placeholder="제목없음"
            spellcheck="false"
          ></div>
        </div>
      </div>
      <div class="toolbar-row toolbar-row-secondary">
        <span id="cell-coordinate" class="cell-coordinate">—</span>
        <div class="toolbar-secondary-end">
          <span id="grid-size-label" class="grid-size-label">5행 × 5열</span>
          <div class="toolbar-actions">
            <button
              id="help-guide-btn"
              type="button"
              class="help-guide-btn"
              aria-label="사용 가이드"
            >
              <svg
                class="help-guide-btn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75" />
                <circle cx="12" cy="8" r="1.15" fill="currentColor" />
                <path
                  d="M12 11v5.5"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                />
              </svg>
              <span class="help-guide-btn-label help-guide-btn-label--full">사용 가이드</span>
              <span class="help-guide-btn-label help-guide-btn-label--short" aria-hidden="true">가이드</span>
            </button>
            <button id="export-btn" type="button" class="export-btn">
              <span class="export-btn-text export-btn-text--full">Export Excel</span>
              <span class="export-btn-text export-btn-text--short" aria-hidden="true">Export</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="grid-wrapper">
      <div id="spreadsheet" class="spreadsheet" aria-label="스프레드시트 그리드"></div>
    </section>
  </main>

  <menu id="context-menu" class="context-menu hidden" type="context"></menu>

  <div
    id="help-guide-modal"
    class="help-guide-modal hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="help-guide-title"
    aria-hidden="true"
  >
    <div class="help-guide-backdrop" tabindex="-1"></div>
    <div class="help-guide-panel">
      <header class="help-guide-header">
        <h2 id="help-guide-title" class="help-guide-title">사용 가이드</h2>
        <button
          id="help-guide-close"
          type="button"
          class="help-guide-close"
          aria-label="닫기"
        >
          ×
        </button>
      </header>
      <div class="help-guide-body">
        <ul id="help-guide-list" class="help-guide-list"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
