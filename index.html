<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Spreadsheet</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar-row toolbar-row-title">
        <div class="sheet-title-wrap" id="sheet-title-wrap">
          <div
            id="sheet-title-field"
            class="sheet-title-field"
            contenteditable="false"
            role="textbox"
            aria-label="시트 제목"
            aria-multiline="false"
            data-placeholder="제목없음"
            spellcheck="false"
          ></div>
        </div>
        <button id="export-btn" type="button" class="export-btn">Export Excel</button>
      </div>
      <div class="toolbar-row toolbar-row-meta">
        <span id="cell-coordinate" class="cell-coordinate">—</span>
        <span id="grid-size-label" class="grid-size-label">5행 × 5열</span>
      </div>
    </header>

    <section class="grid-wrapper">
      <div id="spreadsheet" class="spreadsheet" aria-label="스프레드시트 그리드"></div>
    </section>
  </main>

  <menu id="context-menu" class="context-menu hidden" type="context"></menu>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
