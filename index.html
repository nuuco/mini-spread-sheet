<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Spreadsheet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="toolbar-row toolbar-row-title">
        <div class="sheet-title-wrap" id="sheet-title-wrap">
          <button
            type="button"
            class="sheet-title-display"
            id="sheet-title-display"
            aria-label="시트 제목 편집"
          >
            <span class="sheet-title-text" id="sheet-title-text">제목없음</span>
          </button>
          <input
            id="sheet-title"
            class="sheet-title-input"
            type="text"
            maxlength="80"
            autocomplete="off"
            aria-label="시트 제목"
          />
        </div>
        <button id="export-btn" type="button" class="export-btn">Export Excel</button>
      </div>
      <div class="toolbar-row toolbar-row-meta">
        <span id="cell-coordinate" class="cell-coordinate">Cell: A1</span>
        <span id="grid-size-label" class="grid-size-label">5행 × 5열</span>
      </div>
    </header>

    <section class="grid-wrapper">
      <div id="spreadsheet" class="spreadsheet" aria-label="스프레드시트 그리드"></div>
    </section>
  </main>

  <menu id="context-menu" class="context-menu hidden" type="context"></menu>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
